# plugin roster. Mutual exclusion between skins is managed by the skin-center
# (home-layer managed rows in ~/.dsh/cordis.patch.yml) — the same shape as the
# bundled skins inside @linxin666/dsh-skins.
- insert:
    - id: ui-skin-claude-code-white
      name: '@linxin666/dsh-client-ui-skin-claude-code-white'
